experiment_name: qwen_dynamical_edge_burn256
seed: 1234
device: cuda
dtype: float32
attn_implementation: eager
output_dir: /data1/luohaoming/model_feature/experiments/qwen_dynamical_edge_burn256/results
cache_dir: /public/luohaoming/model_feature/hf_cache
offline: true
skip_existing: true

models:
  - name: Qwen/Qwen2.5-0.5B
    revision: main
    tokenizer: Qwen/Qwen2.5-0.5B

dataset:
  name: wikitext
  config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: 4
  sequence_lengths: [128]

dynamics:
  target: final_hidden
  operator_update: direct
  token_mode: nonpad_flattened
  burn_in_steps: 256
  eval_steps: 128
  perturbation_epsilon: 1.0e-5
  divergence_threshold: 1.0e6
  collapse_threshold: 1.0e-8
  convergence_tol: 1.0e-6
  sensitivity_growth: 10.0
  frobenius_eval_states: 4
  frobenius_probes: 4
  probe_distribution: rademacher
  save_trajectory_summary: true
  trajectory_projection: fixed_random
  projection_seed: 20260710
  lag_distance_windows: [1, 2, 4, 8, 16, 32, 64]
  product_jacobian_windows: []
  product_jacobian_probes: 0
