experiment_name: pythia_epsilon_1e7
seed: 1234
device: cuda
dtype: float32
attn_implementation: eager
output_dir: /home/luohaoming/model_feature_experiments/pythia_epsilon_sensitivity/eps_1e7
cache_dir: /public/luohaoming/model_feature/hf_cache
offline: true
skip_existing: true
models: [{name: EleutherAI/pythia-70m, revision: main, tokenizer: EleutherAI/pythia-70m}]
