experiment_name: pythia_dynamical_edge_small
seed: 1234
device: cuda
dtype: float32
attn_implementation: eager
output_dir: /data1/luohaoming/model_feature/results
cache_dir: /public/luohaoming/model_feature/hf_cache
offline: true
skip_existing: true

models:
  - name: EleutherAI/pythia-70m
    revision: main
    tokenizer: EleutherAI/pythia-70m

dataset:
  name: wikitext
  config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: 4
  sequence_lengths: [64]

dynamics:
  target: final_hidden
  operator_update: direct
  token_mode: nonpad_flattened
  burn_in_steps: 4
  eval_steps: 4
  perturbation_epsilon: 1.0e-5
  divergence_threshold: 1.0e6
  collapse_threshold: 1.0e-8
  convergence_tol: 1.0e-6
  sensitivity_growth: 10.0
  frobenius_eval_states: 2
  frobenius_probes: 2
  probe_distribution: rademacher
