experiment_name: model_download_prep
seed: 1234
device: auto
dtype: float32
attn_implementation: eager
output_dir: results
cache_dir: /public/luohaoming/model_feature/hf_cache
offline: false
skip_existing: true

models:
  - name: gpt2
    revision: main
    tokenizer: gpt2
  - name: Qwen/Qwen2.5-0.5B
    revision: main
    tokenizer: Qwen/Qwen2.5-0.5B

# Gemma candidate tried and skipped:
# - google/gemma-3-270m is gated on Hugging Face and requires authentication.

dataset:
  name: wikitext
  config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: 8
  sequence_lengths: [128]

layers: [first, middle, last]
batch_size: 1
power_iterations: 5
top_k_singular_values: 8
jacobian_token_mode: nonpad_flattened
